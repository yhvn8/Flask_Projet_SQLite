<!DOCTYPE>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Clients</title>
</head>
<body>
    <h1>Liste des Clients</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>Création</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Adresse</th>
        </tr>
        {% for row in data %}
        <tr>
            <td>{{ row['id'] }}</td>
            <td>{{ row['created'] }}</td>
            <td>{{ row['nom'] }}</td>
            <td>{{ row['prenom'] }}</td>
            <td>{{ row['adresse'] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
